<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UberAte - Account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <a href="index.html">Restaurants</a>
    <a href="menu.html">Menus</a>
    <a href="manage.html">Manage</a>
  </nav>

  <header><h1>My account</h1></header>

  <section>
    <p id="account-status" class="result" role="status">Loading your account…</p>
    <p id="account-error" class="error" role="alert"></p>
    <p id="account-signin" hidden><a href="signin.html">Sign in to view your account</a></p>

    <div id="account-details" hidden>
      <p id="account-identity"></p>

      <form id="profile-form" hidden>
        <label for="profile-name">Name</label>
        <input id="profile-name" name="name" autocomplete="name" maxlength="80" required>

        <label for="profile-email">Email</label>
        <input id="profile-email" name="email" type="email" readonly>

        <label for="profile-phone">Phone</label>
        <input id="profile-phone" name="phone" type="tel" autocomplete="tel" maxlength="30">

        <label for="profile-address">Delivery address</label>
        <input id="profile-address" name="delivery_address" autocomplete="street-address" maxlength="160">

        <button type="submit">Save profile</button>
      </form>

      <button type="button" id="signout">Sign out</button>
      <button type="button" id="close-account" hidden>Deactivate account</button>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/account-nav.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
