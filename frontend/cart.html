<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UberAte - Cart</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      align-items: start;
      margin-top: 1.5rem;
    }

    @media (max-width: 768px) {
      .cart-layout { grid-template-columns: 1fr; }
    }

    .cart-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1.25rem;
    }

    .cart-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .cart-card-header h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.92rem;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .alert.visible { display: block; }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 1rem;
      align-items: center;
      padding: 0.9rem 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .cart-item:last-child { border-bottom: none; }

    .item-name {
      font-weight: 600;
      margin: 0 0 0.2rem;
    }

    .item-unit {
      color: #6b7280;
      font-size: 0.88rem;
    }

    .qty-controls {
      display: inline-flex;
      align-items: center;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    .qty-controls button {
      background: #f9fafb;
      border: none;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }

    .qty-controls button:hover:not(:disabled) { background: #e5e7eb; }
    .qty-controls button:disabled { opacity: 0.4; cursor: not-allowed; }

    .qty-value {
      min-width: 32px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .line-total {
      font-weight: 600;
      min-width: 72px;
      text-align: right;
    }

    .btn-cart {
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.95rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-checkout {
      background: #111827;
      color: #ffffff;
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      margin-top: 1rem;
    }

    .btn-checkout:hover:not(:disabled) { background: #374151; }
    .btn-checkout:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-ghost-danger {
      background: transparent;
      color: #dc2626;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
    }

    .btn-ghost-danger:hover { background: #fef2f2; }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 0.65rem 0;
      font-size: 0.96rem;
    }

    .summary-row.total {
      border-top: 1px solid #e5e7eb;
      padding-top: 0.85rem;
      margin-top: 0.85rem;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: #6b7280;
    }

    .empty-state a {
      display: inline-block;
      margin-top: 0.75rem;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Restaurants</a>
    <a href="menu.html">Menus</a>
    <a href="manage.html">Manage</a>
    <a href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a>
    <a href="orders.html">My Orders</a>
  </nav>

  <header>
    <p class="eyebrow">Ready to order</p>
    <h1>Your Cart</h1>
    <p class="lede">Review your items, adjust quantities, or clear your order.</p>
  </header>

  <main class="cart-layout">
    <section class="cart-card">
      <div class="cart-card-header">
        <h2>Items</h2>
        <button id="clear-cart-btn" class="btn-cart btn-ghost-danger" hidden>Clear Cart</button>
      </div>

      <div id="cart-alert" class="alert" role="alert"></div>
      <div id="cart-items-container"></div>
    </section>

    <aside class="cart-card">
      <div class="cart-card-header">
        <h2>Order Summary</h2>
      </div>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="summary-subtotal">$0.00</span>
      </div>
      <div class="summary-row">
        <span>Delivery Fee</span>
        <span id="summary-delivery">$0.00</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="summary-total">$0.00</span>
      </div>
      <button id="checkout-btn" class="btn-cart btn-checkout" disabled>Proceed to Checkout</button>
    </aside>
  </main>

  <script src="js/api.js"></script>
  <script src="js/account-nav.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
